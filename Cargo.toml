[package]
name = "imgconvert"
version = "1.0.1"
edition = "2024"
description = "AVIF / WebP 批次轉 PNG / JPG 工具"
license = "MIT"

[[bin]]
name = "ImgConvert"
path = "src/main.rs"

[dependencies]
# avif-native = dav1d 解碼（BSD-2，靜態連結）；webp 為純 Rust 解碼
image = { version = "0.25", default-features = false, features = ["avif-native", "webp", "png", "jpeg", "rayon"] }
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts"] }
# 只為開啟 egui 的 emoji 圖示字型（按鈕上的 📁 ↻ 等符號）
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
rfd = "0.18"
rayon = "1.12"
walkdir = "2.5"

# build script 在主機（WSL2）執行，故不加 target 條件；build.rs 內判斷目標是否為 Windows
[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

# 僅供在 WSL2/Linux 上開發測試時能跑 GUI；Windows 版不受影響
[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
